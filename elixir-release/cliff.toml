# git-cliff configuration for Elixir release pull requests.

[changelog]
header = ""
body = ""
footer = ""
trim = true
format = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
  { pattern = " \\(#[0-9]+\\)$", replace = "" },
]
commit_parsers = [
  { field = "remote.username", pattern = "^dependabot\\[bot\\]$", skip = true },
  { field = "remote.pr_title", pattern = "(?i)^(bump|update|remove|unlock).*\\bdeps?\\b", skip = true },
  { field = "remote.pr_title", pattern = "^(chore|build)\\(deps.*\\)", skip = true },
  { field = "remote.pr_title", pattern = "^chore(\\([^)]*\\))?: (prepare )?release", skip = true },
  { field = "remote.pr_title", pattern = "^feat(ure)?(\\([^)]*\\))?!?:", group = "Features" },
  { field = "remote.pr_title", pattern = "^fix(\\([^)]*\\))?!?:", group = "Bug Fixes" },
  { field = "remote.pr_title", pattern = "^perf(\\([^)]*\\))?!?:", group = "Performance Improvements" },
  { field = "remote.pr_title", pattern = "^refactor(\\([^)]*\\))?!?:", group = "Code Refactoring" },
  { field = "remote.pr_title", pattern = "^docs?(\\([^)]*\\))?!?:", group = "Documentation" },
  { field = "remote.pr_title", pattern = "^revert(\\([^)]*\\))?!?:", group = "Reverts" },
  { field = "remote.pr_title", pattern = "^security(\\([^)]*\\))?!?:", group = "Security" },
  { message = "(?i)^(bump|update|remove|unlock).*\\bdeps?\\b", skip = true },
  { message = "^(chore|build)\\(deps.*\\)", skip = true },
  { message = "^chore(\\([^)]*\\))?: (prepare )?release", skip = true },
  { message = "^feat(ure)?(\\([^)]*\\))?!?:", group = "Features" },
  { message = "^fix(\\([^)]*\\))?!?:", group = "Bug Fixes" },
  { message = "^perf(\\([^)]*\\))?!?:", group = "Performance Improvements" },
  { message = "^refactor(\\([^)]*\\))?!?:", group = "Code Refactoring" },
  { message = "^docs?(\\([^)]*\\))?!?:", group = "Documentation" },
  { message = "^revert(\\([^)]*\\))?!?:", group = "Reverts" },
  { message = "^security(\\([^)]*\\))?!?:", group = "Security" },
  { message = "^(style|test|build|ci|chore)", skip = true },
  { message = ".*", group = "Other Changes" },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"

[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
