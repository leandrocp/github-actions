name: Elixir - Test

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
        description: "Working directory for mix commands"
      pairs:
        type: string
        default: "[{\"name\": \"OTP 25.1, Elixir 1.15.0\", \"elixir\": \"1.15.0\", \"otp\": \"25.1\"}, {\"name\": \"OTP 29.x, Elixir 1.20.x\", \"elixir\": \"1.20.x\", \"otp\": \"29.x\"}, {\"name\": \"OTP 29, Elixir main\", \"elixir\": \"main-otp-29\", \"otp\": \"maint-29\"}]"
      env_vars:
        type: string
        default: "{}"
        description: "Additional environment variables as JSON object (e.g., '{\"MDEX_BUILD\": \"1\"}')"
      rust-toolchain:
        type: string
        default: ""
        description: "Optional Rust toolchain to install for jobs that compile Rust or NIF code"
      coverage:
        type: boolean
        default: false
        description: "Run tests with coverage enabled"

env:
  MIX_ENV: test

jobs:
  test:
    name: ${{ matrix.name || format('OTP {0}, Elixir {1}', matrix.otp, matrix.elixir) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: ${{ fromJSON(inputs.env_vars) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pairs) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}

    - name: Setup Rust
      if: inputs.rust-toolchain != ''
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.rust-toolchain }}

    - name: Disable compile warnings
      run: echo "::remove-matcher owner=elixir-mixCompileWarning::"

    - name: Cache mix dependencies
      uses: actions/cache@v6
      id: mix-cache
      with:
        path: |
          ${{ inputs.working-directory }}/deps
          ${{ inputs.working-directory }}/_build
        key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles(format('{0}/mix.lock', inputs.working-directory)) }}
        restore-keys: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

    - name: Install mix dependencies
      run: |
        mix deps.get
        mix deps.compile

    - name: Run tests
      if: ${{ !inputs.coverage }}
      run: mix test

    - name: Run tests with coverage
      if: ${{ inputs.coverage }}
      run: mix test --cover
