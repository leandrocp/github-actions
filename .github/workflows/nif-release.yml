name: NIF Release

on:
  workflow_call:
    inputs:
      project-name:
        type: string
        required: true
        description: "Name of the NIF project (e.g., 'my_nif')"
      project-dir:
        type: string
        required: true
        description: "Directory containing the NIF project (e.g., 'native/my_nif')"
      nif-versions:
        type: string
        default: '["2.15"]'
        description: "NIF versions to build for"
      feature-variants:
        type: string
        default: '[{"features":"","variant":""}]'
        description: "Feature variants to build, as JSON objects with features and variant keys"
      working-directory:
        type: string
        default: "."
        description: "Directory containing mix.exs (e.g., 'packages/elixir/my_app')"

jobs:
  build:
    name: ${{ matrix.job.os }} ${{ matrix.job.target }}, ${{ matrix.nif }}, ${{ matrix.variant.variant || 'default' }}, ${{ matrix.job.variant || 'default' }}
    runs-on: ${{ matrix.job.os }}
    timeout-minutes: 60

    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        nif: ${{ fromJSON(inputs.nif-versions) }}
        variant: ${{ fromJSON(inputs.feature-variants) }}
        job:
          - { target: aarch64-apple-darwin,         os: macos-14 }
          - { target: aarch64-unknown-linux-gnu,    os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl,   os: ubuntu-24.04, use-cross: true }
          - { target: arm-unknown-linux-gnueabihf,  os: ubuntu-24.04, use-cross: true }
          - { target: riscv64gc-unknown-linux-gnu,  os: ubuntu-24.04, use-cross: true }
          - { target: x86_64-apple-darwin,          os: macos-14 }
          - { target: x86_64-pc-windows-gnu,        os: windows-2022,                  rustflags: "-C target-feature=+fxsr,+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+popcnt,+avx,+fma" }
          - { target: x86_64-pc-windows-gnu,        os: windows-2022,                  variant: "legacy_cpu" }
          - { target: x86_64-pc-windows-msvc,       os: windows-2022,                  rustflags: "-C target-feature=+fxsr,+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+popcnt,+avx,+fma" }
          - { target: x86_64-pc-windows-msvc,       os: windows-2022,                  variant: "legacy_cpu" }
          - { target: x86_64-unknown-freebsd,       os: ubuntu-22.04, use-cross: true, rustflags: "-C target-feature=+fxsr,+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+popcnt,+avx,+fma" }
          - { target: x86_64-unknown-freebsd,       os: ubuntu-22.04, use-cross: true, variant: "legacy_cpu" }
          - { target: x86_64-unknown-linux-gnu,     os: ubuntu-24.04,                  rustflags: "-C target-feature=+fxsr,+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+popcnt,+avx,+fma" }
          - { target: x86_64-unknown-linux-gnu,     os: ubuntu-24.04,                  variant: "legacy_cpu" }
          - { target: x86_64-unknown-linux-musl,    os: ubuntu-24.04, use-cross: true }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Extract crate information
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          # Get the project version from mix.exs
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> "$GITHUB_ENV"

      - name: Maybe add Rust flags for compilation
        shell: bash
        run: |
          echo "RUSTFLAGS=${{ matrix.job.rustflags }}" >> "$GITHUB_ENV"
        if: ${{ matrix.job.rustflags }}

      - name: Configure feature variant
        shell: bash
        run: |
          cargo_args=""
          if [ "${{ matrix.variant.variant }}" != "" ]; then
            nif="${{ matrix.nif }}"
            cargo_args="--no-default-features --features nif_version_${nif//./_}"
            if [ "${{ matrix.variant.features }}" != "" ]; then
              cargo_args="$cargo_args,${{ matrix.variant.features }}"
            fi
          fi

          variant="${{ matrix.job.variant }}"
          if [ "$variant" != "" ] && [ "${{ matrix.variant.variant }}" != "" ]; then
            variant="${variant}_${{ matrix.variant.variant }}"
          elif [ "${{ matrix.variant.variant }}" != "" ]; then
            variant="${{ matrix.variant.variant }}"
          fi

          echo "CARGO_ARGS=$cargo_args" >> "$GITHUB_ENV"
          echo "FINAL_VARIANT=$variant" >> "$GITHUB_ENV"

      - name: Add target
        shell: bash
        run: |
          rustup target add ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-precomp
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}-${{ matrix.job.os }}-${{ matrix.variant.variant || 'default' }}
          workspaces: |
            ${{ inputs.project-dir }}

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.1.5
        with:
          project-name: ${{ inputs.project-name }}
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          cross-version: 'from-source'
          project-dir: ${{ inputs.project-dir }}
          variant: ${{ env.FINAL_VARIANT }}
          cargo-args: ${{ env.CARGO_ARGS }}

      - name: Artifact attestation
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build-crate.outputs.file-path }}

      - name: Artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download NIF artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "*${{ inputs.project-name }}*"
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
