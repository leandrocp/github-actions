name: Validate Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'elixir-release/**'
      - 'git-cliff/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'elixir-release/**'
      - 'git-cliff/**'
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

      - name: Test Elixir release changelog helper
        run: python3 -m unittest discover -s elixir-release -p 'test_*.py' -v

      - name: Install git-cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          version: v2.14.2
          config: elixir-release/install.toml
          args: --offline --strip=all --output=${{ runner.temp }}/git-cliff-install-check

      - name: Test shared release notes
        env:
          GIT_CLIFF: ${{ runner.temp }}/git-cliff/bin/git-cliff
        run: python3 -m unittest discover -s git-cliff -p 'test_*.py' -v
