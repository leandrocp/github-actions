name: Validate Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'elixir-release/**'
      - 'git-cliff/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'elixir-release/**'
      - 'git-cliff/**'
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Run actionlint
        uses: raven-actions/actionlint@v2.2.0
        with:
          fail-on-error: true

      - name: Verify workflow dependency lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify

      - name: Test Elixir release changelog helper
        run: python3 -m unittest discover -s elixir-release -p 'test_*.py' -v

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.14.2
          config: elixir-release/install.toml
          args: --offline --strip=all --output=${{ runner.temp }}/git-cliff-install-check

      - name: Test shared release notes
        env:
          GIT_CLIFF: ${{ runner.temp }}/git-cliff/bin/git-cliff
        run: python3 -m unittest discover -s git-cliff -p 'test_*.py' -v
