name: Validate Workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'elixir-release/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'elixir-release/**'
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

      - name: Test Elixir release changelog helper
        run: python3 -m unittest discover -s elixir-release -p 'test_*.py' -v
