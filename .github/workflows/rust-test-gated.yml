name: Rust - Test (Stable Gate)

on:
  workflow_call:
    inputs:
      stable-os-versions:
        type: string
        default: '["ubuntu-22.04", "windows-2022", "macos-14"]'
        description: "OS versions to test with rust stable"
      nightly-os-versions:
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
        description: "OS versions to test with rust nightly"
      manifest-path:
        type: string
        default: "Cargo.toml"
        description: "Path to Cargo.toml (e.g., 'native/my_nif/Cargo.toml')"
      test-args:
        type: string
        default: ""
        description: "Additional arguments passed to cargo nextest run"
      msrv:
        type: string
        default: ""
        description: "Minimum Supported Rust Version (e.g., '1.82.0')"

jobs:
  test-stable:
    uses: ./.github/workflows/rust-test.yml
    with:
      stable-os-versions: ${{ inputs.stable-os-versions }}
      nightly-os-versions: ${{ inputs.nightly-os-versions }}
      manifest-path: ${{ inputs.manifest-path }}
      test-args: ${{ inputs.test-args }}
      test-stage: stable
      msrv: ${{ inputs.msrv }}

  test-compatibility:
    needs: test-stable
    uses: ./.github/workflows/rust-test.yml
    with:
      stable-os-versions: ${{ inputs.stable-os-versions }}
      nightly-os-versions: ${{ inputs.nightly-os-versions }}
      manifest-path: ${{ inputs.manifest-path }}
      test-args: ${{ inputs.test-args }}
      test-stage: compatibility
      msrv: ${{ inputs.msrv }}
